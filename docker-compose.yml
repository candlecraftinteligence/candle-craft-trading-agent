services:
  postgres:
    image: postgres:16-alpine
    container_name: candle-craft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-candle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-candle_craft}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-candle} -d ${POSTGRES_DB:-candle_craft}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
