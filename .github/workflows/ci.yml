name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python }} tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12.10"
    env:
      LOCAL_MANUAL_MODE: "true"
      ORDER_EXECUTION_ENABLED: "false"
      TELEGRAM_DRY_RUN: "true"
      TELEGRAM_SIGNALS_ENABLED: "false"
      CMC_MODE: "off"
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Exact baseline and compatible rollback objects for round-trip tests.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            config/releases/requirements-tested.txt

      - name: Create isolated project environment
        shell: bash
        run: |
          python -m venv .ci-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.ci-venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c config/releases/requirements-tested.txt

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app scripts src tests

      - name: Run test suite
        run: python -m pytest --junitxml=ci-pytest.xml

      - name: Preserve exact-head test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-pytest.xml
