services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pack
      POSTGRES_PASSWORD: pack
      POSTGRES_DB: pack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pack -d pack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CCI_SOURCE: mock
      LIVE_CCI: "false"
      PACK_ENV: dev
      APP_ENV: dev
      DEV_BROWSER_MODE: "true"
      DATABASE_URL: postgresql+psycopg://pack:pack@postgres:5432/pack
      PACK_SESSION_SECRET: local-dev-only-not-a-secret
      PACK_BOT_TOKEN: ""
      PACK_TELEGRAM_BOT_TOKEN: ""
      PACK_MINI_APP_URL: http://localhost:5173
      BOT_REQUIRED: "false"
      AUTH_MAX_AGE_SECONDS: "86400"
      PACK_FIXTURES_DIR: /srv/pack/fixtures/missions
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://api:8000
      VITE_PACK_ENV: dev
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: Dockerfile
    command: python /srv/pack/apps/bot/main.py
    environment:
      PYTHONPATH: /srv/pack/apps/api
      PACK_TELEGRAM_BOT_TOKEN: ${PACK_TELEGRAM_BOT_TOKEN:-}
      PACK_MINI_APP_URL: ${PACK_MINI_APP_URL:-http://localhost:5173}
      BOT_REQUIRED: "false"
